name: release-installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag to receive the installers
        required: true
        default: v0.1.1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run pure security tests
        run: dotnet run --project tests\SecureWall.Core.Tests\SecureWall.Core.Tests.csproj

      - name: Download pinned WiX 3.14.1
        id: wix
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $root = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest `
            -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' `
            -OutFile $zip
          $expected = '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "WiX archive hash mismatch: $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Build unsigned installers
        shell: powershell
        run: .\tools\release\Build-SecureWallRelease.ps1 -WixRoot '${{ steps.wix.outputs.root }}'

      - name: Verify installer packages
        shell: powershell
        run: .\tests\installer\Test-SecureWallInstaller.ps1 -ArtifactsDirectory artifacts\release

      - uses: actions/upload-artifact@v4
        with:
          name: SecureWall-${{ github.event.release.tag_name || inputs.tag }}-unsigned
          path: |
            artifacts/release/SecureWall_*.msi
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: SecureWall-${{ github.event.release.tag_name || inputs.tag }}-unsigned
          path: artifacts

      - name: Verify tag and prerelease status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' TinyWall/TinyWall.csproj | head -n 1)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match application version $version" >&2
            exit 1
          fi
          prerelease=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)
          if [ "$prerelease" != "true" ]; then
            echo "Refusing to upload unsigned installers to a non-prerelease release" >&2
            exit 1
          fi

      - name: Attach installers to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber
