<!doctype html>
<!-- Square icon: site/images/mark.svg, optionally on the theme colour.
     render.mjs sets ?size=N&bg=1&pad=N. -->
<html lang="en"><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;overflow:hidden;background:transparent}div{box-sizing:border-box;display:flex}img{width:100%;height:100%;display:block}</style>
</head><body><div id="box"><img src="../../../site/images/mark.svg" alt=""></div>
<script>
const q = new URLSearchParams(location.search), size = +q.get('size'), pad = +(q.get('pad') || 0);
const box = document.getElementById('box');
Object.assign(box.style, { width: size + 'px', height: size + 'px', padding: pad + 'px', background: q.get('bg') ? '#17191a' : 'transparent' });
</script></body></html>
